[project]
name = "bird-detector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dmitrii Kuzmin", email = "cjxrust@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true